services:
  php:
    image: php:8.4.26-fpm-alpine3.23
    container_name: ctf-cross-php
    command: php -S 0.0.0.0:8000 -t /app
    read_only: true
    tmpfs:
      - /tmp:rw,size=32m,mode=1777
    mem_limit: 1g
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - ./public:/app:ro
      - ./print-flag:/usr/local/bin/print-flag:ro
    networks:
      - ctf-cross-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ctf-cross-nginx
    depends_on:
      - php
    ports:
      - "127.0.0.1:18166:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ctf-cross-net
    restart: unless-stopped

networks:
  ctf-cross-net:
    name: ctf-cross-net